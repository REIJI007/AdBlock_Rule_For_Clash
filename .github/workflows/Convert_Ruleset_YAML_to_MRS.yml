name: Convert_Ruleset_YAML_to_MRS

on:
  workflow_run:
    workflows:
      - "Run_AdBlock_Rule_Generator_YAML"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adblock-main-artifact-publisher
  cancel-in-progress: false

jobs:
  convert-yaml-to-mrs:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard main publication
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'MRS publication is restricted to main.'
          }

      - name: Validate YAML domain input
        run: |
          if (-not (Test-Path ./adblock_reject_domain.yaml)) {
            throw 'YAML domain input is missing. The YAML generation workflow must complete first.'
          }

      - name: Download latest Mihomo
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/MetaCubeX/mihomo/releases/latest' -Headers @{ 'User-Agent' = 'AdBlock_Rule_For_Clash' }
          $asset = $release.assets | Where-Object {
            $_.name -match '(?i)windows' -and
            $_.name -match '(?i)amd64' -and
            $_.name -match '(?i)\.zip$'
          } | Select-Object -First 1
          if (-not $asset) { throw 'Could not find the latest Mihomo Windows amd64 ZIP asset.' }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ./mihomo.zip
          Expand-Archive ./mihomo.zip ./mihomo -Force
          $exe = Get-ChildItem ./mihomo -Recurse -Filter mihomo.exe | Select-Object -First 1
          if (-not $exe) { throw 'mihomo.exe was not found in the release archive.' }
          Copy-Item $exe.FullName ./mihomo.exe -Force
          & ./mihomo.exe -v

      - name: Convert YAML domain input to MRS
        run: |
          & ./mihomo.exe convert-ruleset domain yaml ./adblock_reject_domain.yaml ./adblock_reject.mrs
          if ($LASTEXITCODE -ne 0) { throw 'Mihomo domain ruleset conversion failed.' }
          if (-not (Test-Path ./adblock_reject.mrs)) { throw 'MRS output was not created.' }

      - name: Commit MRS only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- adblock_reject.mrs
          if (git diff --cached --quiet) { Write-Host 'MRS artifact is unchanged.'; exit 0 }
          git commit -m 'chore: update generated adblock MRS rules'
          git push origin HEAD:refs/heads/main
