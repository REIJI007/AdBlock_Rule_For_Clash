name: Convert Domain YAML to MRS

on:
  workflow_run:
    workflows:
      - "Build AdBlock Rule Providers"
      - "Generate AdBlock TXT rules (manual)"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adblock-artifact-publishing
  cancel-in-progress: false

jobs:
  convert:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard publication branch
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'MRS publication is restricted to main.'
          }

      - name: Check domain behavior input
        run: |
          if (-not (Test-Path ./adblock_reject_domain.yaml)) {
            throw 'adblock_reject_domain.yaml is missing. Build the DOMAIN provider first.'
          }

      - name: Download latest Mihomo
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/MetaCubeX/mihomo/releases/latest' -Headers @{ 'User-Agent' = 'AdBlock_Rule_For_Clash' }
          $asset = $release.assets | Where-Object { $_.name -match '(?i)windows' -and $_.name -match '(?i)amd64' -and $_.name -match '(?i)\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'Could not find the latest Mihomo Windows amd64 ZIP asset.' }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ./mihomo.zip
          Expand-Archive ./mihomo.zip ./mihomo -Force
          $exe = Get-ChildItem ./mihomo -Recurse -Filter mihomo.exe | Select-Object -First 1
          if (-not $exe) { throw 'mihomo.exe was not found in the release archive.' }
          Copy-Item $exe.FullName ./mihomo.exe -Force
          & ./mihomo.exe -v

      - name: Convert domain behavior YAML to MRS
        run: |
          & ./mihomo.exe convert-ruleset domain yaml ./adblock_reject_domain.yaml ./adblock_reject.mrs
          if ($LASTEXITCODE -ne 0) { throw 'Mihomo domain ruleset conversion failed.' }
          if (-not (Test-Path ./adblock_reject.mrs)) { throw 'MRS output file was not created.' }

      - name: Commit MRS artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adblock_reject.mrs
          if (git diff --cached --quiet) { Write-Host 'No MRS changes.'; exit 0 }
          git commit -m 'chore: update adblock_reject.mrs'
          git push origin HEAD:refs/heads/main
