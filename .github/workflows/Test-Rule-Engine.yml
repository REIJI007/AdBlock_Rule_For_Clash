name: Test Embedded Rule Generators

on:
  pull_request:
    branches: [main]
    paths:
      - 'adblock_rule_generator_*.ps1'
      - 'upstream-sources.json'
      - 'tests/**'
      - '.github/workflows/**'
  push:
    branches:
      - 'refactor/**'
      - 'fix/**'
      - 'upgrade/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PowerShell
        run: pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Install Pester and run regression tests
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force
          Invoke-Pester -Path ./tests -CI

      - name: Validate upstream manifest contract
        shell: pwsh
        run: |
          $urls = @(Get-Content ./upstream-sources.json -Raw -Encoding UTF8 | ConvertFrom-Json)
          if ($urls.Count -ne 315) { throw "Expected 315 active required upstream URLs, found $($urls.Count)." }

          $seen = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($url in $urls) {
            if ($url -isnot [string] -or [string]::IsNullOrWhiteSpace($url)) { throw 'Upstream source list must contain URL strings only.' }
            if (-not $seen.Add([string]$url)) { throw "Duplicate upstream URL: $url" }
            $uri = [Uri]::new([string]$url)
            if (-not $uri.IsAbsoluteUri -or $uri.Scheme -ne 'https') { throw "Upstream URL must be absolute HTTPS: $url" }
          }
            if ($source.required -isnot [bool] -or $source.enabled -isnot [bool]) { throw "required/enabled must be explicit booleans: $($source.url)" }
            if ([long]$source.maxBytes -lt 1 -or [int]$source.retries -lt 0 -or [int]$source.retries -gt 5) {
              throw "Invalid download limits: $($source.url)"
            }
            if ([int]$source.timeoutSeconds -lt 1 -or [int]$source.timeoutSeconds -gt 300) { throw "Invalid timeout: $($source.url)" }
            if ($source.sha256 -and [string]$source.sha256 -notmatch '^[0-9a-fA-F]{64}$') { throw "Invalid pinned SHA-256: $($source.url)" }
            if (-not $seen.Add([string]$source.url)) { throw "Duplicate upstream URL: $($source.url)" }
            $uri = [Uri]::new([string]$source.url)
            if (-not $uri.IsAbsoluteUri -or $uri.Scheme -ne 'https') { throw "Upstream URL must be absolute HTTPS: $($source.url)" }
          }
