name: Generate AdBlock rules

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'AdBlockRuleEngine.psm1'
      - 'adblock_rule_generator_*.ps1'
      - 'sources.json'
      - 'tests/**'
      - '.github/workflows/Run_AdBlock_Rule_Generator_YAML.yml'

permissions:
  contents: write

concurrency:
  group: adblock-rule-generation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PowerShell 7
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell
      - name: Install Pester and run tests
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force
          Invoke-Pester -Path ./tests -CI
      - name: Generate YAML and TXT
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./adblock_rule_generator_yaml.ps1 -Format both
      - name: Commit and push generated rules
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adblock_reject.yaml adblock_reject.txt
          if git diff --cached --quiet; then
            echo "Generated rules are unchanged."
            exit 0
          fi
          git commit -m "chore: update generated adblock rules"
          git push origin "$GITHUB_REF_NAME"
