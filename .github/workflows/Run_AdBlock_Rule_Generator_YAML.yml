name: Build AdBlock Rule Providers

on:
  push:
    branches: [main]
    paths:
      - 'AdBlockRuleEngine.psm1'
      - 'Build-AdblockRules.ps1'
      - 'adblock_rule_generator_yaml.ps1'
      - 'adblock_rule_generator_txt.ps1'
      - 'config/upstream-sources.json'
      - '.github/workflows/Run_AdBlock_Rule_Generator_YAML.yml'
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adblock-artifact-publishing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard publication branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'Scheduled artifact publication is restricted to main.'
            exit 1
          fi

      - name: Build all provider formats
        run: pwsh -NoLogo -NoProfile -File ./Build-AdblockRules.ps1

      - name: Upload source manifest and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adblock-build-diagnostics
          path: |
            adblock_sources_manifest.json
            adblock_build_report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adblock_reject.yaml adblock_reject.txt adblock_reject_domain.yaml adblock_sources_manifest.json adblock_build_report.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Update AdBlock rule providers'
          git push origin HEAD:main
