name: Validate PowerShell generators

on:
  pull_request:
    branches: [main]
    paths:
      - 'adblock_rule_generator_yaml.ps1'
      - 'adblock_rule_generator_txt.ps1'
      - '.github/workflows/Validate_PowerShell_Generators.yml'

permissions:
  contents: read

jobs:
  validate-generators:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PowerShell 7
        run: pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Parse and load YAML generator without generating files
        run: pwsh -NoLogo -NoProfile -File ./adblock_rule_generator_yaml.ps1 -TestMode

      - name: Parse and load TXT generator without generating files
        run: pwsh -NoLogo -NoProfile -File ./adblock_rule_generator_txt.ps1 -TestMode
