name: 全量上游规则语义评估与解析回归

on:
  pull_request:
    paths:
      - adblock_rule_generator_yaml.ps1
      - adblock_rule_generator_txt.ps1
      - tests/**
      - .github/workflows/Semantic_Regression.yml
  push:
    paths:
      - adblock_rule_generator_yaml.ps1
      - adblock_rule_generator_txt.ps1
      - tests/**
      - .github/workflows/Semantic_Regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-regression:
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 运行离线解析器与产物结构回归
        shell: pwsh
        run: ./tests/Invoke-SemanticRegression.ps1 -TargetFormat clash

      - name: 基于完整上游域名规则边界计算语义指标
        shell: pwsh
        timeout-minutes: 60
        run: ./tests/Invoke-UpstreamSemanticAudit.ps1 -TargetFormat clash

      - name: 上传机器可读指标
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-regression-clash
          path: |
            tests/TestResults/parser-regression.json
            tests/TestResults/upstream-semantic-metrics.json
          if-no-files-found: warn
