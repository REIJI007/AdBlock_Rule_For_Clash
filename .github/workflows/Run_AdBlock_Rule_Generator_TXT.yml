name: Generate AdBlock TXT rules (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adblock-rule-generation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PowerShell 7
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell
      - name: Generate TXT
        shell: pwsh
        run: ./adblock_rule_generator_txt.ps1
      - name: Commit and push generated TXT
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adblock_reject.txt
          if git diff --cached --quiet; then
            echo "Generated TXT is unchanged."
            exit 0
          fi
          git commit -m "chore: update generated adblock TXT rules"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
