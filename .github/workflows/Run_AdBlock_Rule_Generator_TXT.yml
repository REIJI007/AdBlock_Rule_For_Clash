name: Legacy TXT Generator (manual compatibility)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adblock-provider-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard publication branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Compatibility publication is restricted to main.'
            exit 1
          fi

      - name: Generate both YAML and TXT from shared engine
        run: pwsh -NoLogo -NoProfile -File ./Build-AdblockRules.ps1

      - name: Commit generated providers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adblock_reject.yaml adblock_reject.txt adblock_reject_domain.yaml adblock_sources_manifest.json adblock_build_report.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Update AdBlock rule providers'
          git push origin HEAD:main
