name: Run_AdBlock_Rule_Generator_TXT

on:
  push:
    branches: [main]
    paths:
      - 'AdBlockRuleEngine.psm1'
      - 'adblock_rule_generator_txt.ps1'
      - 'sources.json'
      - '.github/workflows/Run_AdBlock_Rule_Generator_TXT.yml'
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adblock-txt-publisher
  cancel-in-progress: false

jobs:
  generate-txt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PowerShell
        run: pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Generate TXT only
        shell: pwsh
        run: ./adblock_rule_generator_txt.ps1

      - name: Upload TXT diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adblock-txt-diagnostics
          path: |
            adblock_sources_manifest_txt.json
            adblock_build_report_txt.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit TXT artifacts only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- adblock_reject.txt adblock_sources_manifest_txt.json adblock_build_report_txt.json
          if git diff --cached --quiet; then
            echo "TXT artifacts are unchanged."
            exit 0
          fi
          git commit -m "chore: update generated TXT adblock rules"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            echo "TXT publish push failed on attempt $attempt; retrying after fetching main."
          done
          echo "TXT publish failed after 3 attempts."
          exit 1
