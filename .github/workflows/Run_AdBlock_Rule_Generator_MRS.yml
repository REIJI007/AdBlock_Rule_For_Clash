name: Run_AdBlock_Rule_Generator_MRS

on:
  workflow_run:
    workflows:
      - Run_AdBlock_Rule_Generator_YAML
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adblock-mrs-publisher
  cancel-in-progress: false

jobs:
  generate-mrs:
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout latest main and its generated YAML artifact
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify PowerShell 7 and YAML input
        run: |
          $PSVersionTable.PSVersion.ToString()
          $inputYaml = Join-Path $PWD 'adblock_reject.yaml'
          if (-not (Test-Path -LiteralPath $inputYaml)) { throw 'Generated YAML artifact adblock_reject.yaml is missing.' }
          if ((Get-Item -LiteralPath $inputYaml).Length -lt 16) { throw 'Generated YAML artifact is unexpectedly small.' }
          if (-not (Select-String -LiteralPath $inputYaml -Pattern '^payload:' -Quiet)) { throw 'Generated YAML artifact has no payload section.' }

      - name: Download latest Mihomo
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/MetaCubeX/mihomo/releases/latest' -Headers @{ 'User-Agent' = 'AdBlock_Rule_For_Clash' }
          $asset = $release.assets | Where-Object { $_.name -match '(?i)windows' -and $_.name -match '(?i)amd64' -and $_.name -match '(?i)\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'Could not find the latest Mihomo Windows amd64 ZIP asset.' }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ./mihomo.zip
          if ((Get-Item ./mihomo.zip).Length -lt 1024) { throw 'Downloaded Mihomo archive is unexpectedly small.' }
          Expand-Archive ./mihomo.zip ./mihomo -Force
          $exe = Get-ChildItem ./mihomo -Recurse -Filter mihomo.exe | Select-Object -First 1
          if (-not $exe) { throw 'mihomo.exe was not found in the release archive.' }
          Copy-Item $exe.FullName ./mihomo.exe -Force
          & ./mihomo.exe -v
          if ($LASTEXITCODE -ne 0) { throw 'Mihomo version check failed.' }

      - name: Convert the generated YAML artifact to MRS
        run: |
          & ./mihomo.exe convert-ruleset domain yaml ./adblock_reject.yaml ./adblock_reject.mrs
          if ($LASTEXITCODE -ne 0) { throw 'Mihomo domain ruleset conversion failed.' }
          if (-not (Test-Path ./adblock_reject.mrs)) { throw 'MRS output was not created.' }
          if ((Get-Item ./adblock_reject.mrs).Length -lt 16) { throw 'MRS output is unexpectedly small.' }

      - name: Commit MRS artifact only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- adblock_reject.mrs
          if (git diff --cached --quiet) { Write-Host 'MRS artifact is unchanged.'; exit 0 }
          git commit -m 'chore: update generated MRS adblock rules'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch main before MRS publication.' }
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Failed to rebase MRS publication onto latest main.' }
            git push origin HEAD:refs/heads/main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Warning "MRS publish push failed on attempt $attempt; retrying."
          }
          throw 'MRS publish failed after 3 attempts.'
